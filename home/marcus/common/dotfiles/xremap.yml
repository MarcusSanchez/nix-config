# xremap: per-application key remapping (the AutoHotkey niche).
# Live-editable — xremap runs with --watch=config and reloads on save.
keymap:
  # Ctrl+Alt+F12 switches to an empty VT that displays a stale
  # framebuffer frame (retain-splash side effect) — swallow just that
  # chord by rewriting it to the unused F24. Ctrl+Alt+F1..F11 stay.
  - name: swallow-vt12
    remap:
      ctrl-alt-f12: f24

  # Alt+J/K are up/down arrows EVERYWHERE — vim apps included.
  # J=up / K=down follows the same swapped convention as the niri binds.
  # exact_match keeps chords with MORE modifiers out of these rules:
  # xremap's default match allows extras and forwards them, so
  # Super+Alt+L used to reach niri as Super+Right and eat the lock
  # bind. Same guard on both arrow keymaps.
  - name: vertical-arrows-always
    exact_match: true
    remap:
      alt-j: up
      alt-k: down

  # Alt+H/L become left/right — and Shift+Alt+H/L Home/End — only
  # outside apps that already speak vim: Zed, JetBrains IDEs, and
  # terminals whose title says nvim is running (ghostty's shell
  # integration titles the window after the foreground command; plain
  # shells keep the remap). exact_match keeps the shifted and plain
  # chords from colliding — and Super/Ctrl combos out entirely.
  - name: horizontal-arrows-dynamic
    exact_match: true
    application:
      not:
        - dev.zed.Zed
        - /^jetbrains-/
    window:
      not:
        - /^nvim\b/
    remap:
      alt-h: left
      alt-l: right
      shift-alt-h: home
      shift-alt-l: end

# Right Alt sends Super, so niri combos (Mod+…) are reachable with the
# right thumb instead of stretching the left one across the keyboard.
# modmap (not keymap) remaps at the key level, so it holds for every
# combination, not just bindings xremap knows about.
modmap:
  - name: right-alt-as-super
    remap:
      Alt_R: Super_R
