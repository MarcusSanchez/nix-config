format = """
[](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$username\
$hostname\
[](bg:#394260 fg:#769ff0)\
$directory\
[](bg:#212736 fg:#394260)\
$git_branch\
$git_status\
[](fg:#212736)\
\n$character"""

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
# NixOS has its own symbol otherwise, and with no entry starship falls back
# to its default ❄️ emoji. Generic tux instead.
NixOS = "󰌽"

[username]
show_always = true
style_user = "fg:#e3e5e5 bg:#769ff0"
style_root = "fg:#e3e5e5 bg:#769ff0"
format = '[ $user]($style)'

[hostname]
ssh_only = false
style = "fg:#e3e5e5 bg:#769ff0"
format = '[@$hostname ]($style)'

[directory]
style = "fg:#e3e5e5 bg:#394260"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#212736)]($style)'

[git_status]
style = "bg:#212736"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#212736)]($style)'
