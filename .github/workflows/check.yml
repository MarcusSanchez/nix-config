# Push-to-main is the deploy for both WSL boxes (system.autoUpgrade builds
# pushed main weekly on each), so catch a broken commit here — days before
# the Saturday timer meets it. Mirrors the local verification story:
# `nix flake check` fully evaluates every NixOS host, then the mac system
# is evaluated the same way either machine evals the other's platform.
name: check

on:
  push:
    branches: [main]
    # win-sync (WSL) and auto-commit.nix (mac) auto-push chore commits
    # touching only these mirrored config files; nix copies them without
    # parsing, so they can't affect the build — skip the run
    paths-ignore:
      - "home/marcus/common/dotfiles/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # --inputs-from . pins the linters to the repo's own locked nixpkgs,
      # matching the versions installed on the machines
      - name: lint (statix + deadnix)
        run: |
          nix run --inputs-from . nixpkgs#statix -- check .
          nix run --inputs-from . nixpkgs#deadnix -- --fail .
      # evaluates both nixosConfigurations (nixos, nixos-lite)
      - name: nix flake check
        run: nix flake check
      - name: evaluate the mac system
        run: nix eval --raw '.#darwinConfigurations."Marcuss-MacBook-Air".system.drvPath'
