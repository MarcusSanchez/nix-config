# empty_pattern wants `{ ... }:` module headers rewritten as `_:`.
# `{ ... }:` is this repo's deliberate convention — it uniformly marks
# module files whether or not they currently take arguments.
disabled = ["empty_pattern"]

# generated by nixos-generate-config; not held to this repo's style
ignore = [
  "hosts/tuf-nixos/hardware-configuration.nix",
  "hosts/bedroom-nixos/hardware-configuration.nix",
]
