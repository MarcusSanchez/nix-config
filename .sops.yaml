# Which age recipients can decrypt what. `sops secrets/secrets.yaml` reads
# this to know who to encrypt for; `sops updatekeys secrets/secrets.yaml`
# re-wraps the data key after this list changes.
#
# One shared key across all machines: they all get the same credentials
# decrypted anyway, and because this repo is public a leak means rotating
# at GitHub/atuin/fly regardless — per-machine keys would add re-keying
# round-trips without shrinking that blast radius. The private half lives
# at ~/.config/sops/age/keys.txt (mode 600, never committed) and is backed
# up in Bitwarden; `croc send ~/.config/sops/age/keys.txt` moves it to a
# new machine.
keys:
  - &marcus age17fldh0lkvjg2prs0455uredhev45f30ahhp8vwe4y4x4fknydsaq36rc6u

creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *marcus
